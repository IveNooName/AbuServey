spring:
  application:
    name: ServeyBackend
  # Lokal: Datenbank kommt aus compose.yaml (Spring startet sie selbst). In Produktion via DB_* Env
  # und mit SPRING_DOCKER_COMPOSE_ENABLED=false.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servey}
    username: ${DB_USER:servey}
    password: ${DB_PASSWORD:servey}
  docker:
    compose:
      file: ${COMPOSE_FILE:compose.yaml}
      lifecycle-management: start-only   # Container bleibt nach Stopp der App bestehen (Daten bleiben)
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  admin-key: ${ADMIN_KEY:dev-admin-key}    # in Produktion IMMER ueberschreiben
  cookie:
    name: survey_done
    max-age: 30d
    secure: ${COOKIE_SECURE:false}
  tokens:
    required: ${TOKENS_REQUIRED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
